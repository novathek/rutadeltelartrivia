<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivia Ruta del Telar</title>
  <meta name="description" content="Trivia sobre la Ruta del Telar - tradición textil de Catamarca"/>
<style>




:root {
  --color-bg: #e8d5b8;
  --color-bordo: #7a1c1c;
  --color-bordo-dark: #5e1515;
  --color-bordo-light: #9b2525;
  --color-brown: #7d6545;
  --color-brown-light: #a08060;
  --color-text: #5a4430;
  --color-text-dark: #3d2e1e;
  --color-sand: #f0e4cc;
  --color-sand-dark: #d4bc96;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100dvh;background:var(--color-bg);margin:0;padding:0;overflow-x:hidden;}

#app {
  width:100%;
  min-height:100dvh;
  position:relative;
  font-family:'Open Sans', Georgia, serif;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  background: url('assets app/Fondo.png') center center / cover no-repeat;
}

/* ── Deco bands ─────────────────────────────── */
.deco-top, .deco-bottom {
  width:100%;
  display:block;
  flex-shrink:0;
  line-height:0;
}
.deco-top img, .deco-bottom img {
  width:100%;
  display:block;
  object-fit:cover;
  height:42px;
}

/* ── Content ─────────────────────────────────── */
.content {
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px 16px 14px;
  gap:10px;
  width:100%;
  max-width:500px;
  margin:0 auto;
  flex:1;
}

/* ── Brand area ─────────────────────────────── */
.brand-area {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  animation:pillSlide 0.7s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pillSlide{from{opacity:0;transform:translateY(-20px) scale(0.8);}to{opacity:1;transform:translateY(0) scale(1);}}

.titulo-img {
  max-width:200px;
  width:60%;
  filter: drop-shadow(0 3px 8px rgba(90,68,48,0.2));
}
.trivia-logo-img {
  max-width:180px;
  width:52%;
  margin:18px 0 0 0;
  animation:logoPop 0.8s cubic-bezier(.34,1.56,.64,1) 0.3s both, logoWiggle 4s ease-in-out 1s infinite;
  filter: drop-shadow(0 3px 8px rgba(90,68,48,0.2));
}
@keyframes logoPop{from{opacity:0;transform:scale(0.5) rotate(-6deg);}to{opacity:1;transform:scale(1) rotate(0);}}
@keyframes logoWiggle{0%,100%{transform:rotate(-1.5deg) scale(1);}25%{transform:rotate(1.5deg) scale(1.03);}50%{transform:rotate(-0.8deg) scale(1.05);}75%{transform:rotate(1.2deg) scale(1.02);}}

/* ── Progress ───────────────────────────────── */
.progress-row{width:100%;display:flex;align-items:center;gap:8px;}
.progress-label {
  background: var(--color-bordo);
  color: white;
  font-size:12px;
  font-weight:700;
  border-radius:20px;
  padding:5px 13px;
  white-space:nowrap;
  flex-shrink:0;
  font-family:'Open Sans', Georgia, serif;
  letter-spacing:0.5px;
  animation:labelPop 0.5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes labelPop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.progress-track{flex:1;height:10px;background:rgba(122,28,28,0.18);border-radius:6px;overflow:hidden;}
.progress-fill {
  height:100%;
  background: linear-gradient(90deg, var(--color-bordo), var(--color-bordo-light), var(--color-bordo));
  background-size:200% 100%;
  border-radius:6px;
  transition:width 0.6s cubic-bezier(.34,1.56,.64,1);
  animation:shimmer 2.5s linear infinite;
}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── Question card ──────────────────────────── */
.question-card {
  background: var(--color-sand);
  border-radius:20px;
  padding:20px 18px 16px;
  text-align:center;
  width:100%;
  border: 2px solid var(--color-sand-dark);
  animation:cardEntrance 0.5s cubic-bezier(.34,1.56,.64,1) both;
  box-shadow: 0 4px 20px rgba(90,68,48,0.12);
}
@keyframes cardEntrance{from{opacity:0;transform:translateY(28px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.question-text {
  font-size:16px;
  font-weight:700;
  color:var(--color-text-dark);
  line-height:1.4;
  font-family:'Open Sans', Georgia, serif;
}

/* ── Options ────────────────────────────────── */
.options{width:100%;display:flex;flex-direction:column;gap:9px;}
.option-btn {
  width:100%;
  background: var(--color-sand);
  border: 2px solid var(--color-sand-dark);
  border-radius:16px;
  padding:11px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  text-align:left;
  transition:transform 0.15s, background 0.25s, border-color 0.25s;
  animation:optionSlide 0.4s cubic-bezier(.34,1.56,.64,1) both;
  position:relative;
  overflow:hidden;
  box-shadow: 0 2px 8px rgba(90,68,48,0.08);
}
.option-btn::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(122,28,28,0.1), transparent 70%);
  opacity:0;
  transition:opacity 0.3s;
}
.option-btn:hover::before{opacity:1;}
.option-btn:hover{transform:translateX(5px) scale(1.015); border-color: var(--color-brown-light);}
.option-btn:active{transform:scale(0.97);}
.option-btn:nth-child(1){animation-delay:0.05s;}
.option-btn:nth-child(2){animation-delay:0.12s;}
.option-btn:nth-child(3){animation-delay:0.19s;}
.option-btn:nth-child(4){animation-delay:0.26s;}
@keyframes optionSlide{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:translateX(0);}}
.option-btn.correct {
  background:#f0e4cc;
  border-color: var(--color-bordo);
  animation:correctPop 0.5s cubic-bezier(.34,1.56,.64,1);
}
.option-btn.wrong {
  background:#f5d5d5;
  border-color:#c0392b;
  animation:wrongShake 0.4s ease;
}
@keyframes correctPop{0%{transform:scale(1);}40%{transform:scale(1.05);}70%{transform:scale(0.98);}100%{transform:scale(1);}}
@keyframes wrongShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.option-btn:disabled{pointer-events:none;}

.option-letter {
  width:34px;
  height:34px;
  border-radius:50%;
  background: var(--color-bordo);
  color:white;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:background 0.25s, transform 0.3s;
  font-family:'Open Sans', Georgia, serif;
}
.option-btn.correct .option-letter{background: var(--color-bordo); transform:rotate(360deg) scale(1.15);}
.option-btn.wrong .option-letter{background:#c0392b;}
.option-text {
  font-size:15px;
  font-weight:700;
  color:var(--color-text-dark);
  font-family:'Open Sans', Georgia, serif;
}

/* ── Mascot / feedback container ───────────── */
.condor-container {
  display:none;
  position:relative; margin-top:20px; width:100%;
  z-index:999;
  align-items:flex-end;
  gap:10px;
}
.condor-container.show{display:flex;animation:condorEntrance 0.5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes condorEntrance{from{opacity:0;transform:translateY(36px) scale(0.85);}to{opacity:1;transform:translateY(0) scale(1);}}

/* Speech bubble */
.speech-bubble {
  flex:1;
  background: var(--color-sand);
  border-radius:18px;
  padding:14px 16px;
  position:relative;
  box-shadow:0 12px 48px rgba(90,68,48,0.3);
  color:var(--color-text-dark);
  font-size:13px;
  font-weight:700;
  line-height:1.4;
  border:2.5px solid var(--bubble-color, var(--color-bordo));
  transition:border-color 0.2s;
  font-family:'Open Sans', Georgia, serif;
}
.speech-bubble::after{
  content:'';
  position:absolute;
  bottom:20px;
  left:-9px;
  border-width:9px 9px 9px 0;
  border-style:solid;
  display:none;
  display:block;
  width:0;
  z-index:2;
}
.speech-bubble::before{
  content:'';
  position:absolute;
  bottom:18px;
  left:-13px;
  border-width:11px 11px 11px 0;
  border-style:solid;
  display:none;
  display:block;
  width:0;
  z-index:1;
  transition:border-color 0.2s;
}

/* ── Nav row ────────────────────────────────── */
.nav-row{width:100%;display:flex;align-items:center;gap:9px;margin-top:2px;}
.nav-btn {
  border:none;
  border-radius:50px;
  padding:12px 15px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  flex:1;
  font-family:'Open Sans', Georgia, serif;
  transition:transform 0.15s, filter 0.15s;
  letter-spacing:0.5px;
}
.nav-btn:hover{transform:scale(1.04);}
.nav-btn:active{transform:scale(0.95);}
.nav-btn:disabled{opacity:0.4;pointer-events:none;}
.nav-restart {
  background: var(--color-sand);
  color: var(--color-text-dark);
  border: 2px solid var(--color-sand-dark);
  flex: 0.55;
}
.nav-next {
  background: var(--color-bordo);
  color:white;
  flex:1;
  font-size:15px;
  animation:nextGlow 2.5s ease-in-out infinite;
}
@keyframes nextGlow{0%,100%{box-shadow:0 0 0 0 rgba(122,28,28,0.45);}50%{box-shadow:0 0 14px 4px rgba(122,28,28,0.25);}}

/* ── Score screen ───────────────────────────── */
.score-screen {
  background: var(--color-sand);
  border-radius:22px;
  padding:28px 22px;
  text-align:center;
  width:100%;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:10px;
  border: 2px solid var(--color-sand-dark);
  box-shadow: 0 6px 32px rgba(90,68,48,0.15);
}
.score-screen.show{display:flex;animation:scoreEntrance 0.7s cubic-bezier(.34,1.56,.64,1);}
@keyframes scoreEntrance{from{opacity:0;transform:scale(0.7) rotate(-4deg);}to{opacity:1;transform:scale(1) rotate(0);}}
.score-emoji{font-size:52px;animation:emojiSpin 0.8s cubic-bezier(.34,1.56,.64,1) 0.3s both;}
@keyframes emojiSpin{from{transform:scale(0) rotate(-180deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.score-title{font-size:22px;font-weight:900;color:var(--color-text-dark);font-family:'Open Sans', Georgia, serif;}
.score-sub{font-size:14px;font-weight:700;color:var(--color-bordo);font-family:'Open Sans', Georgia, serif;}
.score-num{font-size:44px;font-weight:900;color:var(--color-bordo);animation:numCount 0.6s cubic-bezier(.34,1.56,.64,1) 0.5s both;font-family:'Open Sans', Georgia, serif;}
@keyframes numCount{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.score-comment{font-size:13px;font-weight:700;color:var(--color-text);font-family:'Open Sans', Georgia, serif;}
.restart-btn {
  background: var(--color-bordo);
  color:white;
  border:none;
  border-radius:50px;
  padding:12px 32px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  font-family:'Open Sans', Georgia, serif;
  margin-top:6px;
  animation:restartPulse 2.5s ease-in-out infinite;
  transition:transform 0.15s;
  letter-spacing:0.5px;
}
@keyframes restartPulse{0%,100%{box-shadow:0 0 0 0 rgba(122,28,28,0.45);}50%{box-shadow:0 0 0 10px rgba(122,28,28,0);}}
.restart-btn:hover{transform:scale(1.06);}

/* ── Confetti ───────────────────────────────── */
.confetti-container{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden;}
.confetti-piece{position:absolute;width:9px;height:9px;top:-20px;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* ── Tablet overrides ───────────────────────── */
@media (min-width: 600px) {
  .deco-top img, .deco-bottom img { height:68px; }
  .content { max-width:820px; padding:22px 28px 20px; gap:14px; }
  .titulo-img { max-width:320px; }
  .trivia-logo-img { max-width:280px; }
  .progress-label { font-size:18px; padding:8px 20px; }
  .progress-track { height:14px; }
  .question-card { padding:36px 32px 26px; border-radius:28px; }
  .question-text { font-size:26px; }
  .options { gap:13px; }
  .option-btn { padding:18px 26px; border-radius:22px; }
  .option-letter { width:50px; height:50px; font-size:22px; }
  .option-text { font-size:22px; }
  .nav-row { gap:14px; margin-top:10px; }
  .nav-btn { padding:18px 26px; font-size:20px; }
  .nav-next { font-size:22px; }
  .condor-container { margin-top:30px; gap:16px; }
  .speech-bubble { font-size:20px; padding:22px 28px; border-radius:28px; border-width:4px; }
  .speech-bubble::before { border-width:18px 18px 18px 0; left:-22px; bottom:28px; }
  .speech-bubble::after { border-width:14px 14px 14px 0; left:-14px; bottom:32px; }
  .score-screen { padding:44px 36px; border-radius:32px; gap:20px; }
  .score-emoji { font-size:80px; }
  .score-title { font-size:36px; }
  .score-sub { font-size:24px; }
  .score-num { font-size:68px; }
  .score-comment { font-size:22px; }
  .restart-btn { padding:18px 56px; font-size:24px; }
}

@media (min-width: 1025px) {
  html,body{display:flex;align-items:center;justify-content:center;padding:0;}
  #app{width:100%;min-height:100dvh;}
  .content {
    max-width:1200px;
    margin:0 auto;
    display:grid;
    grid-template-columns:340px 1fr;
    grid-template-rows:auto auto auto 1fr;
    column-gap:44px;
    row-gap:14px;
    padding:36px 40px;
    width:100%;
    height:100%;
    align-items:center;
    flex:1;
  }
  .brand-area {
    grid-column:1;
    grid-row:1;
    justify-self:center;
  }
  .titulo-img { max-width:240px !important; }
  .trivia-logo-img { max-width:220px !important; margin:0 0 0 0 !important; }
  .progress-row {
    grid-column:1;
    grid-row:2;
    width:100%;
    margin-top:8px;
  }
  .progress-label { font-size:15px; padding:5px 14px; }
  .progress-track { height:11px; }
  .condor-container {
    grid-column:1;
    grid-row:3;
    position:relative !important;
    bottom:auto !important;
    left:auto !important;
    right:auto !important;
    margin-top:8px;
    width:100%;
    align-self:start;
    gap:10px;
  }
  .speech-bubble { font-size:14px; padding:14px 18px; border-radius:22px; border-width:2.5px; }
  .speech-bubble::before { border-width:11px 11px 11px 0; left:-13px; bottom:20px; }
  .speech-bubble::after { border-width:9px 9px 9px 0; left:-9px; bottom:22px; }
  .question-card {
    grid-column:2;
    grid-row:1;
    padding:28px 26px;
    border-radius:26px;
  }
  .question-text { font-size:22px; }
  .options {
    grid-column:2;
    grid-row:2;
    gap:11px;
    margin-top:8px;
  }
  .option-btn { padding:14px 20px; border-radius:18px; }
  .option-letter { width:40px; height:40px; font-size:17px; }
  .option-text { font-size:17px; }
  .nav-row {
    grid-column:2;
    grid-row:3;
    gap:11px;
    margin-top:10px;
  }
  .nav-btn { padding:14px 20px; font-size:16px; }
  .nav-next { font-size:17px; }
  .score-screen {
    grid-column:2;
    grid-row:1 / span 3;
    align-self:center;
    padding:36px 30px;
    border-radius:26px;
    gap:14px;
    max-width:520px;
    justify-self:center;
  }
  .score-emoji { font-size:72px; }
  .score-title { font-size:32px; }
  .score-sub { font-size:22px; }
  .score-num { font-size:64px; }
  .score-comment { font-size:20px; }
  .restart-btn { padding:14px 44px; font-size:18px; }
}
  .speech-bubble::before, .speech-bubble::after {
    display: none !important;
  }
</style>
</head>
<body>

<div id="app">
  <!-- Top decorative band -->
  <div class="deco-top">
    <img src="assets app/deco.png" alt=""/>
  </div>

  <div class="confetti-container" id="confetti"></div>

  <div class="content">
    <!-- Brand -->
    <div class="brand-area">
      <img class="titulo-img brand-pill" src="assets app/rutadeltelarlogo.png" alt="Ruta del Telar"/>
      <img class="trivia-logo-img" src="assets app/trivia.png" alt="Trivia"/>
    </div>

    <!-- Progress -->
    <div class="progress-row">
      <div class="progress-label" id="progressLabel">Pregunta 1 de 15</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:6.67%"></div></div>
    </div>

    <!-- Question card -->
    <div class="question-card" id="questionCard">
      <p class="question-text" id="questionText"></p>
    </div>

    <!-- Options -->
    <div class="options" id="optionsContainer"></div>

    <!-- Score screen -->
    <div class="score-screen" id="scoreScreen">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-title">¡Trivia terminada!</div>
      <div class="score-sub">Tu puntaje</div>
      <div class="score-num" id="scoreNum"></div>
      <div class="score-comment" id="scoreComment"></div>
      <button class="restart-btn" onclick="window.location.href='index.html'">Jugar de nuevo</button>
    </div>

    <!-- Navigation -->
    <div class="nav-row" id="navRow">
      <button class="nav-btn nav-restart" onclick="restart()">Reiniciar</button>
      <button class="nav-btn nav-next" id="btnNext" onclick="goNext()">Siguiente ›</button>
    </div>

    <!-- Feedback / condor container -->
    <div class="condor-container" id="condorContainer">
      <div class="speech-bubble" id="speechBubble"></div>
    </div>
  </div>

  <!-- Bottom decorative band -->
  <div class="deco-bottom">
    <img src="assets app/deco-1.png" alt=""/>
  </div>
</div>

<script>
// ── Audio Engine (Web Audio API) ──────────────────────────────────
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let _actx=null;
function actx(){if(!_actx)_actx=new AudioCtx();return _actx;}

function sndClick(){
  const c=actx(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.type='sine';o.frequency.setValueAtTime(800,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(450,c.currentTime+0.06);
  g.gain.setValueAtTime(0.22,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.08);
  o.start();o.stop(c.currentTime+0.1);
}

function sndCorrect(){
  const c=actx();
  [[0,523.25],[0.11,659.25],[0.22,783.99],[0.33,1046.5]].forEach(([t,f])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(0.34,c.currentTime+t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.28);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+0.32);
  });
  const o2=c.createOscillator(),g2=c.createGain();
  o2.connect(g2);g2.connect(c.destination);
  o2.type='triangle';o2.frequency.value=2093;
  g2.gain.setValueAtTime(0.10,c.currentTime+0.36);
  g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.65);
  o2.start(c.currentTime+0.36);o2.stop(c.currentTime+0.7);
}

function sndWrong(){
  const c=actx();
  [[0,280,90],[0.18,240,75]].forEach(([t,f0,f1])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(f0,c.currentTime+t);
    o.frequency.exponentialRampToValueAtTime(f1,c.currentTime+t+0.22);
    g.gain.setValueAtTime(0.30,c.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.24);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+0.26);
  });
}

function sndQuestion(){
  const c=actx();
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.type='sine';
  o.frequency.setValueAtTime(180,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(660,c.currentTime+0.22);
  g.gain.setValueAtTime(0.16,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.28);
  o.start();o.stop(c.currentTime+0.3);
  [[0.28,440],[0.36,554.37],[0.44,659.25]].forEach(([t,f])=>{
    const o2=c.createOscillator(),g2=c.createGain();
    o2.connect(g2);g2.connect(c.destination);
    o2.type='triangle';o2.frequency.value=f;
    g2.gain.setValueAtTime(0.18,c.currentTime+t);
    g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.18);
    o2.start(c.currentTime+t);o2.stop(c.currentTime+t+0.2);
  });
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const questions = shuffleArray([...allQuestions]).slice(0, 5).map(q => {
  let optsObj = q.opts.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
  optsObj = shuffleArray(optsObj);
  let newCorrect = optsObj.findIndex(o => o.isCorrect);
  return {
    q: q.q,
    opts: optsObj.map(o => o.text),
    correct: newCorrect,
    exp: q.exp
  };
});

let current=0,score=0,answered=false;
const confettiColors=['#7a1c1c','#a08060','#d4bc96','#7d6545','#c0392b','#e8d5b8','#9b2525'];

function launchConfetti(){
  const c=document.getElementById('confetti');
  c.innerHTML='';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=5+Math.random()*9;
    const isRect=Math.random()>0.5;
    p.style.cssText=`left:${Math.random()*100}%;background:${confettiColors[Math.floor(Math.random()*confettiColors.length)]};width:${size}px;height:${isRect?size*0.4:size}px;border-radius:${isRect?'2px':'50%'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    c.appendChild(p);
  }
  setTimeout(()=>{c.innerHTML='';},3500);
}

function launchMiniConfetti(){
  const c=document.getElementById('confetti');
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=4+Math.random()*6;
    p.style.cssText=`left:${20+Math.random()*60}%;background:${confettiColors[Math.floor(Math.random()*confettiColors.length)]};width:${size}px;height:${size}px;border-radius:50%;animation-duration:${0.8+Math.random()*1}s;animation-delay:0s;`;
    c.appendChild(p);
  }
  setTimeout(()=>{c.innerHTML='';},2000);
}

function render(){
  sndQuestion();
  answered=false;
  const q=questions[current];
  document.getElementById('progressLabel').textContent=`Pregunta ${current+1} de ${questions.length}`;
  document.getElementById('progressFill').style.width=`${((current+1)/questions.length)*100}%`;

  const qCard=document.getElementById('questionCard');
  qCard.style.animation='none';
  void qCard.offsetWidth;
  qCard.style.animation='cardEntrance 0.5s cubic-bezier(.34,1.56,.64,1) both';
  document.getElementById('questionText').textContent=q.q;

  const letters=['A','B','C','D'];
  const container=document.getElementById('optionsContainer');
  container.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML=`<div class="option-letter">${letters[i]}</div><span class="option-text">${opt}</span>`;
    btn.style.animationDelay=`${0.05+i*0.07}s`;
    btn.addEventListener('mousemove',e=>{
      const r=btn.getBoundingClientRect();
      btn.style.setProperty('--mx',`${((e.clientX-r.left)/r.width)*100}%`);
      btn.style.setProperty('--my',`${((e.clientY-r.top)/r.height)*100}%`);
    });
    btn.onclick=()=>{sndClick();selectOption(i,btn);};
    container.appendChild(btn);
  });

  const condorContainer=document.getElementById('condorContainer');
  condorContainer.className='condor-container';
  document.getElementById('speechBubble').innerHTML='';
  document.getElementById('scoreScreen').className='score-screen';
  document.getElementById('questionCard').style.display='';
  document.getElementById('optionsContainer').style.display='';
  document.getElementById('navRow').style.display='';
}

function selectOption(idx,btn){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const allBtns=document.querySelectorAll('.option-btn');
  allBtns.forEach(b=>b.disabled=true);
  const condorContainer=document.getElementById('condorContainer');
  const speechBubble=document.getElementById('speechBubble');

  let prefix='';
  if(idx===q.correct){
    btn.classList.add('correct');
    score++;
    prefix='<strong style="color:#7a1c1c;display:block;margin-bottom:4px;font-size:14px;">¡Correcto! 🎉</strong>';
    sndCorrect();
    launchMiniConfetti();
    speechBubble.style.setProperty('--bubble-color','#7a1c1c');
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('correct');
    prefix='<strong style="color:#c0392b;display:block;margin-bottom:4px;font-size:14px;">¡Incorrecto! ❌</strong>';
    sndWrong();
    speechBubble.style.setProperty('--bubble-color','#c0392b');
  }
  speechBubble.innerHTML=prefix+q.exp;
  condorContainer.className='condor-container show';
}

function goNext(){
  if(current<questions.length-1){
    current++;
    render();
  } else {
    showScore();
  }
}

function showScore(){
  document.getElementById('questionCard').style.display='none';
  document.getElementById('optionsContainer').style.display='none';
  document.getElementById('condorContainer').className='condor-container';
  document.getElementById('navRow').style.display='none';
  const ss=document.getElementById('scoreScreen');
  ss.className='score-screen show';
  document.getElementById('scoreNum').textContent=`${score} / ${questions.length}`;
  const pct=score/questions.length;
  let emoji,comment;
  if(pct===1){emoji='🏆';comment='¡Puntaje perfecto! Sos un experto en la Ruta del Telar.';}
  else if(pct>=0.7){emoji='🌟';comment='¡Muy bien! Conocés bastante la tradición textil.';}
  else if(pct>=0.4){emoji='👏';comment='Buen intento, ¡seguí aprendiendo sobre el telar!';}
  else{emoji='🧵';comment='Te queda mucho por descubrir sobre la Ruta del Telar.';}
  document.getElementById('scoreEmoji').textContent=emoji;
  document.getElementById('scoreComment').textContent=comment;
  if(pct>=0.6)launchConfetti();
}

function restart(){
  current=0;score=0;
  document.getElementById('questionCard').style.display='';
  document.getElementById('optionsContainer').style.display='';
  document.getElementById('navRow').style.display='';
  render();
}

render();
