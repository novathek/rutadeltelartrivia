<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivia Ruta del Telar</title>
  <meta name="description" content="¿Cuánto sabés sobre la Ruta del Telar? ¡Poné a prueba tus conocimientos sobre la tradición textil de Catamarca!"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg:     #e8d5b8;
      --color-bordo:  #7a1c1c;
      --color-bordo2: #5e1515;
      --color-brown:  #7d6545;
    }

    body { min-height:100dvh; background:var(--color-bg); font-family:'Open Sans',Georgia,serif; overflow-x:hidden; }

    #app {
      width:100%; min-height:100dvh; position:relative;
      display:flex; flex-direction:column; align-items:stretch;
      background:url('assets app/Fondo.png') center center / cover no-repeat;
    }

    /* ── Deco bands ── */
    .deco-top, .deco-bottom { width:100%; display:block; flex-shrink:0; line-height:0; overflow:hidden; }
    .deco-top img  { width:100%; display:block; object-fit:cover; animation:decoSlideLeft  0.9s cubic-bezier(.34,1.56,.64,1) 0.05s both; }
    .deco-bottom img { width:100%; display:block; object-fit:cover; animation:decoSlideRight 0.9s cubic-bezier(.34,1.56,.64,1) 0.40s both; }

    /* ── Canvas (free-position container) ── */
    #canvas { flex:1; position:relative; width:100%; overflow:visible; min-height:200px; }

    /* ── Position wrappers ── */
    #pos-rdt, #pos-trivia, #pos-btn, #pos-ctagobierno, #pos-ministerio {
      position: absolute;
      transform: translateX(-50%);
    }

    /* ── Inner elements ── */
    .rdt-logo, .trivia-logo {
      width:100%; display:block;
      filter:drop-shadow(0 4px 12px rgba(90,68,48,0.18));
    }
    .rdt-logo    { animation: fadeSlideDown 0.8s cubic-bezier(.34,1.56,.64,1) 0.2s both; }
    .trivia-logo { animation: bouncePop 0.8s cubic-bezier(.34,1.56,.64,1) 0.6s both,
                               triviaPulse 4s ease-in-out 1.5s infinite; }

    .btn-iniciar {
      width:100%; padding:0; border:none; border-radius:14px; background:transparent;
      cursor:pointer; position:relative; overflow:hidden;
      transition:transform 0.15s, filter 0.15s;
      animation: slideUp 0.7s cubic-bezier(.34,1.56,.64,1) 1s both;
    }
    .btn-iniciar img { width:100%; display:block; border-radius:14px; }
    .btn-iniciar:hover  { transform:scale(1.05); filter:brightness(1.1); }
    .btn-iniciar:active { transform:scale(0.96); }
    .btn-iniciar::after {
      content:''; position:absolute; inset:0; border-radius:14px;
      background:radial-gradient(circle at var(--rx,50%) var(--ry,50%), rgba(255,255,255,0.28), transparent 70%);
      opacity:0; transition:opacity 0.4s;
    }
    .btn-iniciar.ripple::after { opacity:1; }

    #pos-ctagobierno img, #pos-ministerio img {
      width:100%; display:block; object-fit:contain;
      animation: fadeUp 0.6s ease 1.4s both;
    }

    /* ── Animations ── */
    @keyframes fadeSlideDown  { from{opacity:0;transform:translateY(-40px) scale(0.92);}  to{opacity:1;transform:translateY(0) scale(1);} }
    @keyframes bouncePop      { from{opacity:0;transform:scale(0.5) rotate(-6deg);}        to{opacity:1;transform:scale(1) rotate(0);} }
    @keyframes triviaPulse    { 0%,100%{transform:scale(1) rotate(-1deg);} 25%{transform:scale(1.03) rotate(1deg);} 50%{transform:scale(1.05) rotate(-0.5deg);} 75%{transform:scale(1.02) rotate(0.8deg);} }
    @keyframes slideUp        { from{opacity:0;transform:translateY(50px) scale(0.9);}     to{opacity:1;transform:translateY(0) scale(1);} }
    @keyframes fadeUp         { from{opacity:0;transform:translateY(16px);}                to{opacity:1;transform:translateY(0);} }
    @keyframes decoSlideLeft  { from{opacity:0;transform:translateX(-100%);}               to{opacity:1;transform:translateX(0);} }
    @keyframes decoSlideRight { from{opacity:0;transform:translateX(100%);}                to{opacity:1;transform:translateX(0);} }
    @keyframes exitBlast      { 0%{opacity:1;transform:scale(1) rotate(0);} 40%{opacity:1;transform:scale(1.05) rotate(0.5deg);} 100%{opacity:0;transform:scale(0.88) rotate(-1deg);} }

    #app.exit { animation:exitBlast 0.55s cubic-bezier(.55,0,1,.45) forwards; }
  </style>

  <!-- ╔══════════════════════════════════════════════════╗
       ║  LAYOUT BLOCK — managed by editor.html           ║
       ║  Edit freely in the visual editor                ║
       ╚══════════════════════════════════════════════════╝ -->
  <style id="__layout__">
.deco-top img    { height: 37px; }
.deco-bottom img { height: 37px; }
#pos-rdt    { left: 50%; top: 13.7%; width: 64.4%; max-width: 251px; }
#pos-trivia { left: 50%; top: 36.8%; width: 47.9%; max-width: 187px; }
#pos-btn    { left: 50%; top: 61.3%; width: 81%; max-width: 316px; }
#pos-ctagobierno { left: 34%; top: 89.9%; width: 29%; max-width: 113px; }
#pos-ministerio  { left: 68.1%; top: 90.7%; width: 25.6%; max-width: 100px; }
</style>
</head>
<body>

<div id="app">
  <div class="deco-top"><img src="assets app/deco.png" alt=""/></div>

  <div id="canvas">
    <div id="pos-rdt">
      <img class="rdt-logo" src="assets app/rutadeltelarlogo.png" alt="Ruta del Telar"/>
    </div>
    <div id="pos-trivia">
      <img class="trivia-logo" src="assets app/trivia.png" alt="Trivia"/>
    </div>
    <div id="pos-btn">
      <button class="btn-iniciar" id="btnIniciar" onclick="iniciar(this,event)" aria-label="Comenzar la trivia">
        <img src="assets app/BOTON.png" alt="Comenzar"/>
      </button>
    </div>
    <div id="pos-ctagobierno">
      <img src="assets app/ctagobiernologo.png" alt="Catamarca Gobierno"/>
    </div>
    <div id="pos-ministerio">
      <img src="assets app/ministeriologo.png" alt="Ministerio de Educación y Trabajo"/>
    </div>
  </div>

  <div class="deco-bottom"><img src="assets app/deco-1.png" alt=""/></div>
</div>

<script>
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let _actx=null;
function actx(){if(!_actx)_actx=new AudioCtx();return _actx;}

function sndIntro(){
  const c=actx();
  [[0,392],[0.13,523.25],[0.26,659.25],[0.39,783.99],[0.52,1046.5]].forEach(([t,f])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime+t);g.gain.linearRampToValueAtTime(0.18,c.currentTime+t+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.35);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+0.4);
  });
}

function sndHover(){
  const c=actx(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type='sine';
  o.frequency.setValueAtTime(900,c.currentTime);o.frequency.exponentialRampToValueAtTime(600,c.currentTime+0.05);
  g.gain.setValueAtTime(0.12,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.07);
  o.start();o.stop(c.currentTime+0.08);
}

function sndLaunch(){
  const c=actx();
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type='sine';
  o.frequency.setValueAtTime(220,c.currentTime);o.frequency.exponentialRampToValueAtTime(1760,c.currentTime+0.38);
  g.gain.setValueAtTime(0.28,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.42);
  o.start();o.stop(c.currentTime+0.45);
  [523.25,659.25,783.99].forEach((f,i)=>{
    const o2=c.createOscillator(),g2=c.createGain();
    o2.connect(g2);g2.connect(c.destination);o2.type='triangle';o2.frequency.value=f;
    g2.gain.setValueAtTime(0.16,c.currentTime+0.3+i*0.06);g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.55+i*0.06);
    o2.start(c.currentTime+0.3+i*0.06);o2.stop(c.currentTime+0.6+i*0.06);
  });
}

const btn=document.getElementById('btnIniciar');
let hovered=false;
btn.addEventListener('mouseenter',()=>{if(!hovered){sndHover();hovered=true;}});
btn.addEventListener('mouseleave',()=>{hovered=false;});
btn.addEventListener('mousemove',e=>{
  const r=btn.getBoundingClientRect();
  btn.style.setProperty('--rx',`${((e.clientX-r.left)/r.width)*100}%`);
  btn.style.setProperty('--ry',`${((e.clientY-r.top)/r.height)*100}%`);
});

function iniciar(el,event){
  sndLaunch();
  el.classList.add('ripple');
  document.getElementById('app').classList.add('exit');
  setTimeout(()=>{window.location.href='trivia.html';},550);
}

window.addEventListener('click',()=>sndIntro(),{once:true});
setTimeout(()=>{try{sndIntro();}catch(e){}},1200);
</script>
</body>
</html>
